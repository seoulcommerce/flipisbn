<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlipISBN</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:#f6f3ec; color:#141414; margin:0; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { letter-spacing: -0.03em; }
    .ok { color: #1b6b3a; }
    .err { color: #a1271c; }
    a { color: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><strong>FlipISBN</strong></p>
    <h1>Thanks.</h1>
    <p id="msg">Checking payment…</p>
    <p><a href="/">Back</a></p>
  </div>
<script>
const params = new URLSearchParams(location.search);
const sessionId = params.get("session_id") || "";
const msg = document.getElementById("msg");
(async () => {
  if (!sessionId) {
    msg.className = "err";
    msg.textContent = "No payment session. If you paid, email stevie@seoulwebdesign.com.";
    return;
  }
  try {
    const r = await fetch("/api/confirm?session_id=" + encodeURIComponent(sessionId));
    const data = await r.json();
    if (data && data.paid) {
      msg.className = "ok";
      msg.textContent = "Payment received. We'll send the keep-or-list sheet to " + (data.email || "your email") + ". eBay sold and buyback are filled by hand. We never invent sold prices.";
      return;
    }
  } catch (_) {}
  msg.className = "err";
  msg.textContent = "We could not confirm that payment. Email stevie@seoulwebdesign.com if you were charged.";
})();
</script>
</body>
</html>
